name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18', '24']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # 用使用者的方式装一遍：只装打包出来的文件，确认命令行能启动
      - name: Install packed tarball
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          npm init -y > /dev/null
          npm install --no-audit --no-fund ./ugc-lens-*.tgz
          npx ugc-lens --version
          npx ugc-lens --help
          npx ugc-lens playbook
          npx ugc-lens playbook --init
          npx ugc-lens ui --help
          test -f node_modules/ugc-lens/ui/app.js
          node --input-type=module -e "import { createMcpServer } from 'ugc-lens/mcp'; await createMcpServer().close()"
          node --input-type=module -e "import { readFile } from 'node:fs/promises'; await readFile(new URL('./skills/ugc-lens/SKILL.md', import.meta.resolve('ugc-lens/package.json')), 'utf8')"
          UGC_LENS_TEST_CLI="$RUNNER_TEMP/node_modules/ugc-lens/dist/cli/index.js" node --test "$GITHUB_WORKSPACE/test/cli/mcp.test.ts" "$GITHUB_WORKSPACE/test/cli/formats.test.ts"
