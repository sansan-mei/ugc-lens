name: Desktop package

# 桌面单文件包（roadmap 第 19.1 步）：Node 26 SEA + 虚拟文件系统，产出 macOS dmg 和 Windows 安装包。
# 构建、冒烟检查，产物作为 Actions artifact 保存，不签名公证。
# 版本号变化时由 release.yml 调用（workflow_call），再把产物挂到 GitHub Release；本工作流自身不发布。
# 自动触发只看打包相关文件，避免每次推送都占用 macOS、Windows 运行器；其他改动需要新包时手动运行。
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [master]
    paths:
      - .github/workflows/desktop.yml
      - scripts/sea.ts
      - scripts/desktop_entry.mjs
      - scripts/desktop_smoke.ts
      - scripts/desktop/**
      - src/cli/desktop.ts
      - src/cli/ui.ts
      - src/ui/instance.ts
  pull_request:
    paths:
      - .github/workflows/desktop.yml
      - scripts/sea.ts
      - scripts/desktop_entry.mjs
      - scripts/desktop_smoke.ts
      - scripts/desktop/**
      - src/cli/desktop.ts
      - src/cli/ui.ts
      - src/ui/instance.ts

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac-arm64
          - os: windows-2025
            target: win-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
      # 打包用的 Node 版本就是用户机器上实际运行的版本；useVfs 需要 26.9 以上
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.0'
      - run: bun install --frozen-lockfile
      - run: npm run build

      - name: Production dependencies
        run: |
          mkdir -p build/sea/deps
          cp package.json bun.lock bunfig.toml build/sea/deps/
          cd build/sea/deps
          bun install --production --frozen-lockfile --ignore-scripts --linker hoisted

      - name: Build SEA
        run: node scripts/sea.ts --deps build/sea/deps

      # arm64 的 macOS 不运行没有签名的程序，先做本机临时签名（不是开发者签名，没有公证）
      - if: runner.os == 'macOS'
        run: codesign --sign - --force build/sea/ugc-lens

      - name: Smoke
        run: |
          EXE=build/sea/ugc-lens
          [ "$RUNNER_OS" = Windows ] && EXE=build/sea/ugc-lens.exe
          node scripts/desktop_smoke.ts "$EXE"

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APP=build/dmg/ugc-lens.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" build/ugc-lens.iconset
          cp build/sea/ugc-lens "$APP/Contents/MacOS/ugc-lens"
          # 图标由脚本画出 1024 像素 PNG，再缩放成 iconset 各尺寸
          node scripts/desktop/icon.ts build/icon-1024.png
          for s in 16 32 128 256 512; do
            sips -z $s $s build/icon-1024.png --out "build/ugc-lens.iconset/icon_${s}x${s}.png" > /dev/null
            sips -z $((s*2)) $((s*2)) build/icon-1024.png --out "build/ugc-lens.iconset/icon_${s}x${s}@2x.png" > /dev/null
          done
          iconutil -c icns build/ugc-lens.iconset -o "$APP/Contents/Resources/ugc-lens.icns"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>ugc-lens</string>
            <key>CFBundleIconFile</key><string>ugc-lens</string>
            <key>CFBundleIdentifier</key><string>io.github.sansan-mei.ugc-lens</string>
            <key>CFBundleName</key><string>ugc-lens</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSUIElement</key><true/>
          </dict>
          </plist>
          EOF
          codesign --sign - --force --deep "$APP"
          ln -s /Applications build/dmg/Applications
          cp "scripts/desktop/打开前必读.txt" build/dmg/
          # GitHub 的 macOS 运行器上 hdiutil 偶尔报 "Resource busy"（磁盘映像服务被占用），间隔重试
          DMG="build/ugc-lens-${VERSION}-${{ matrix.target }}.dmg"
          for attempt in 1 2 3 4; do
            rm -f "$DMG"
            hdiutil create -volname ugc-lens -srcfolder build/dmg -format ULMO "$DMG" && break
            if [ "$attempt" = 4 ]; then echo "hdiutil 连续 4 次失败"; exit 1; fi
            echo "hdiutil 第 $attempt 次失败，$((attempt * 15)) 秒后重试"
            sleep $((attempt * 15))
          done

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          # 安装程序、快捷方式和卸载项用脚本画出的 .ico；不改 SEA 可执行文件本身的资源，避免碰到注入的程序数据
          node scripts/desktop/icon.ts build/ugc-lens.ico
          & $iscc /Qp "/DAppVersion=$version" "/DSourceExe=$PWD\build\sea\ugc-lens.exe" "/DIconFile=$PWD\build\ugc-lens.ico" "/DOutDir=$PWD\build" scripts\desktop\ugc-lens.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sizes
        run: |
          {
            echo "### ${{ matrix.target }}"
            echo '| 文件 | 大小 |'
            echo '|---|---|'
            EXE=build/sea/ugc-lens
            [ "$RUNNER_OS" = Windows ] && EXE=build/sea/ugc-lens.exe
            for f in build/sea/app.zip "$EXE" build/*.dmg build/*-setup.exe; do
              [ -f "$f" ] && echo "| $(basename "$f") | $(node -p "(require('fs').statSync('$f').size/1048576).toFixed(1)") MB |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ugc-lens-${{ matrix.target }}
          path: |
            build/*.dmg
            build/*-setup.exe
          if-no-files-found: error
