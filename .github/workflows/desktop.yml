name: Desktop prototype

# 桌面单文件包原型（roadmap 第 19.1 步）：Node 26 SEA + 虚拟文件系统，产出 macOS dmg 和 Windows zip。
# 只做构建和冒烟检查，产物作为 Actions artifact 保存，不发布、不签名公证。
on:
  workflow_dispatch:
  push:
    branches: [sea-prototype]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac-arm64
          - os: windows-2025
            target: win-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
      # 打包用的 Node 版本就是用户机器上实际运行的版本；useVfs 需要 26.9 以上
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.0'
      - run: bun install --frozen-lockfile
      - run: npm run build

      - name: Production dependencies
        run: |
          mkdir -p build/sea/deps
          cp package.json bun.lock bunfig.toml build/sea/deps/
          cd build/sea/deps
          bun install --production --frozen-lockfile --ignore-scripts --linker hoisted

      - name: Build SEA
        run: node scripts/sea.ts --deps build/sea/deps

      # arm64 的 macOS 不运行没有签名的程序，先做本机临时签名（不是开发者签名，没有公证）
      - if: runner.os == 'macOS'
        run: codesign --sign - --force build/sea/ugc-lens

      - name: Smoke
        run: |
          EXE=build/sea/ugc-lens
          [ "$RUNNER_OS" = Windows ] && EXE=build/sea/ugc-lens.exe
          node scripts/desktop_smoke.ts "$EXE"

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APP=build/dmg/ugc-lens.app
          mkdir -p "$APP/Contents/MacOS"
          cp build/sea/ugc-lens "$APP/Contents/MacOS/ugc-lens"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>ugc-lens</string>
            <key>CFBundleIdentifier</key><string>io.github.sansan-mei.ugc-lens</string>
            <key>CFBundleName</key><string>ugc-lens</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSUIElement</key><true/>
          </dict>
          </plist>
          EOF
          codesign --sign - --force --deep "$APP"
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname ugc-lens -srcfolder build/dmg -format ULFO "build/ugc-lens-${VERSION}-${{ matrix.target }}.dmg"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          Compress-Archive -Path build/sea/ugc-lens.exe -DestinationPath "build/ugc-lens-$version-${{ matrix.target }}.zip" -CompressionLevel Optimal

      - name: Sizes
        run: |
          {
            echo "### ${{ matrix.target }}"
            echo '| 文件 | 大小 |'
            echo '|---|---|'
            for f in build/sea/app.zip build/sea/ugc-lens build/sea/ugc-lens.exe build/*.dmg build/*.zip; do
              [ -f "$f" ] && echo "| $(basename "$f") | $(node -p "(require('fs').statSync('$f').size/1048576).toFixed(1)") MB |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ugc-lens-${{ matrix.target }}
          path: |
            build/*.dmg
            build/*.zip
          if-no-files-found: error
