name: Release

# master 上 package.json 的版本号和 npm 上已有的都不同时发布。
# 认证用 npm Trusted Publishing（OIDC），不需要 token；npmjs.com 上配置的工作流文件名必须是 release.yml。
on:
  push:
    branches: [master]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Trusted Publishing 需要 npm 11.5.1 以上
      - run: npm install -g npm@11.17.0

      - name: Check version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "ugc-lens@$VERSION" version > /dev/null 2>&1; then
            echo "ugc-lens@$VERSION 已经发布过，跳过"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.publish == 'true'
        run: bun install --frozen-lockfile
      # prepublishOnly 会先跑类型检查、测试和编译
      - if: steps.version.outputs.publish == 'true'
        run: npm publish --access public

      - name: Tag
        if: steps.version.outputs.publish == 'true'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "$TAG" > /dev/null; then
            echo "标签 $TAG 已存在"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
