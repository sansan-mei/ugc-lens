<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ugc-lens</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <header class="topbar glass">
    <a class="brand" href="#" id="brand">
      <svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true">
        <defs><linearGradient id="brand-grad" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#2f7bff"/><stop offset="0.5" stop-color="#7a5cff"/><stop offset="1" stop-color="#ff5fa2"/></linearGradient></defs>
        <rect width="32" height="32" rx="9" fill="url(#brand-grad)"/>
        <circle cx="14" cy="14" r="6.5" fill="none" stroke="#fff" stroke-width="2.6"/>
        <path d="M19 19 L24.5 24.5" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/>
      </svg>
      <span>ugc-lens</span>
    </a>
    <nav class="tabs" id="tabs" aria-label="视图">
      <button type="button" data-tab="overview" class="tab">概况</button>
      <button type="button" data-tab="items" class="tab">原文</button>
      <button type="button" data-tab="reports" class="tab">报告</button>
      <button type="button" data-tab="chat" class="tab">对话</button>
    </nav>
    <button type="button" class="btn btn-primary" id="open-file">打开数据</button>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer glass" id="drawer" hidden aria-label="原文详情">
    <div class="drawer-head">
      <strong>原文</strong>
      <button type="button" class="btn btn-ghost btn-sm" id="drawer-close">关闭</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <div class="scrim" id="picker-scrim" hidden></div>
  <section class="picker glass" id="picker" hidden aria-label="选择数据文件">
    <div class="drawer-head">
      <strong>打开数据文件</strong>
      <button type="button" class="btn btn-ghost btn-sm" id="picker-close">关闭</button>
    </div>
    <p class="muted small" id="picker-cwd"></p>
    <input type="search" class="input" id="picker-filter" placeholder="筛选文件名">
    <div class="file-list" id="file-list"></div>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
